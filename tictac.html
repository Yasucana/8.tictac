<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 5px;
            margin: 20px auto;
            width: 310px;
        }
        .cell {
            width: 100px;
            height: 100px;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            cursor: pointer;
        }
        .cell.x::before {
            content: 'X';
            color: blue;
        }
        .cell.o::before {
            content: 'O';
            color: red;
        }
        #reset, #nextLevel {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 1em;
        }
        #nextLevel {
            display: none;
        }
        #levelDisplay {
            text-align: center;
            font-size: 1.5em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="levelDisplay">レベル: 1</div>
    <div class="grid">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
    <button id="reset">リセット</button>
    <button id="nextLevel">次のレベル</button>

    <script>
        const cells = document.querySelectorAll('.cell');
        const resetButton = document.getElementById('reset');
        const nextLevelButton = document.getElementById('nextLevel');
        const levelDisplay = document.getElementById('levelDisplay');
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X'; // プレイヤーは 'X', AIは 'O'
        let gameActive = true;
        let aiLevel = 1; // 初期AIレベル

        const winningConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function handleCellClick(event) {
            const index = event.target.dataset.index;
            if (board[index] !== '' || !gameActive || currentPlayer !== 'X') return;

            board[index] = 'X';
            event.target.classList.add('x');
            checkResult();

            if (gameActive) {
                currentPlayer = 'O';
                setTimeout(aiMove, 500); // AIの動きを少し遅らせる
            }
        }

        function aiMove() {
            let move;
            if (aiLevel >= 2) {
                move = findWinningMove('O'); // AIが勝てる手
                if (move !== null) {
                    board[move] = 'O';
                    cells[move].classList.add('o');
                    checkResult();
                    currentPlayer = 'X';
                    return;
                }
            }
            if (aiLevel >= 3) {
                move = findWinningMove('X'); // プレイヤーが勝てる手（ブロック）
                if (move !== null) {
                    board[move] = 'O';
                    cells[move].classList.add('o');
                    checkResult();
                    currentPlayer = 'X';
                    return;
                }
            }
            // ランダムな手
            const emptyCells = board.map((val, index) => val === '' ? index : null).filter(val => val !== null);
            if (emptyCells.length === 0) return;
            const randomIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            board[randomIndex] = 'O';
            cells[randomIndex].classList.add('o');
            checkResult();
            currentPlayer = 'X';
        }

        function findWinningMove(player) {
            for (const condition of winningConditions) {
                const [a, b, c] = condition;
                if (board[a] === player && board[b] === player && board[c] === '') return c;
                if (board[a] === player && board[c] === player && board[b] === '') return b;
                if (board[b] === player && board[c] === player && board[a] === '') return a;
            }
            return null;
        }

        function checkResult() {
            for (const condition of winningConditions) {
                const [a, b, c] = condition;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    gameActive = false;
                    alert('WIN');
                    if (board[a] === 'X') {
                        nextLevelButton.style.display = 'block'; // プレイヤーが勝った場合のみ表示
                    }
                    return;
                }
            }

            if (!board.includes('')) {
                gameActive = false;
                alert('引き分けです！');
            }
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            cells.forEach(cell => {
                cell.classList.remove('x', 'o');
            });
            currentPlayer = 'X';
            gameActive = true;
            nextLevelButton.style.display = 'none';
            levelDisplay.textContent = `レベル: ${aiLevel}`; // レベル表示を更新
        }

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        resetButton.addEventListener('click', resetGame);
        nextLevelButton.addEventListener('click', function() {
            aiLevel++;
            resetGame();
            levelDisplay.textContent = `レベル: ${aiLevel}`; // レベルアップ時に表示を更新
        });

        // ゲーム開始時に初期レベルを表示
        levelDisplay.textContent = `レベル: ${aiLevel}`;
    </script>
</body>
</html>
